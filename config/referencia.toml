Si el pedido no llegó y procede compensar, reembolsa en dinero, no con un cupón.
Nunca rechaces sin explicar el motivo con datos del ticket.
Usa solo los datos del ticket: no inventes políticas ni información.'''

p5 = '''Responde siempre con este formato y nada más:
Recomendación: Reembolso de X € | Cupón de X € | Rechazar | Pedir información | Pasar al supervisor
Confianza: alta, media o baja
Por qué: una o dos frases con los datos del ticket que lo justifican
¿Lo aplica el agente directamente?: sí o no
Mensaje para el cliente: dos frases amables y concretas (si pides información, di exactamente qué necesitas)'''

p6 = '''Pide información si el mensaje es demasiado vago para saber qué pasó o si las señales se contradicen (por ejemplo, el GPS confirma la entrega pero el repartidor acumula incidencias).
