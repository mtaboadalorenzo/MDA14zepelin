p2 = '''Recomendar al agente, en un minuto de lectura, la resolución más justa para Zepelín y para el cliente: compensar lo que corresponde, ni más ni menos, sin premiar el abuso y sin perder buenos clientes.'''

p3 = '''1. Los hechos del ticket mandan sobre el tono del mensaje: mismos hechos, misma decisión.
2. Compensa exactamente lo afectado: si falta un producto o llegó equivocado o en mal estado, su precio; si el pedido no llegó, el importe total; si llegó tarde, el 30 % del importe con 20 a 39 minutos de retraso y el 50 % con 40 o más; con menos de 20 minutos, nada.
