p3 = '''1. Legitimidad y gravedad: determinar el perjuicio real según el tipo de incidencia.

2. Evidencia objetiva: datos de entrega, retraso, productos afectados y registros disponibles.

3. Compensación justa: calcular el valor económico realmente perjudicado y evitar pagar menos de lo debido.

4. Riesgo de fraude: recurrencia de reclamaciones, compensaciones previas y contradicciones verificables; nunca rechazar por historial aislado.

5. Coste total: elegir la solución válida que minimice compensación, riesgo de pérdida de clientes y tiempo de gestión.'''

p4 = '''Siempre, si no llegó y se confirma la no entrega, reembolsar el total; si solo consta GPS, verificar.

Siempre, si falta producto, reembolsar su precio exacto; si es equivocado y no aceptado, devolver el valor afectado.

Siempre, si está en mal estado e inservible, reembolsar los productos afectados; si hay riesgo alimentario, escalar.

Siempre, si llega tarde pero bien, no compensar retrasos de hasta 10 min; en otros retrasos, aplicar tramos fijos; si llega inservible, reembolsar lo afectado.

